name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  design:
    name: design
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Audit theme contrast against WCAG AA
        run: python3 tools/contrast_audit.py

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Android modules and assemble debug
        run: ./gradlew --stacktrace check assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Connected instrumentation checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: >
            ./gradlew --stacktrace connectedCheck
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.erishan.traceback.ScreenshotTest

      - name: Upload Android CI reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  ios:
    name: ios
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Compile Kotlin iOS simulator modules and link shipped framework
        run: ./gradlew --stacktrace :shared:compileKotlinIosSimulatorArm64 :ui:compileKotlinIosSimulatorArm64 :iosCompose:compileKotlinIosSimulatorArm64 :iosCompose:linkDebugFrameworkIosSimulatorArm64 :iosCompose:checkXcodeProjectConfiguration

      - name: Build iOS host app
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath iosApp/build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS CI reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-reports
          path: |
            shared/build/reports/
            ui/build/reports/
            iosCompose/build/reports/
            iosApp/build/DerivedData/Logs/
          if-no-files-found: ignore

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [design, android, ios]
    if: always()
    steps:
      - name: Verify platform gates
        run: |
          if [ "${{ needs.design.result }}" != "success" ] || [ "${{ needs.android.result }}" != "success" ] || [ "${{ needs.ios.result }}" != "success" ]; then
            echo "design=${{ needs.design.result }}"
            echo "android=${{ needs.android.result }}"
            echo "ios=${{ needs.ios.result }}"
            exit 1
          fi
